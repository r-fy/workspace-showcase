<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css?v=117">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workspace">
</head>
<body>

<!-- Login (PIN) -->
<div id="login-overlay">
  <div class="login-box">
    <h1>Workspace</h1>
    <div id="login-error" class="login-error hidden"></div>
    <!-- Starts empty on purpose — one dot is added per digit typed, never a fixed
         row revealing the PIN's length before you start typing. -->
    <div class="pin-dots" id="pin-dots"></div>
    <div class="pin-pad">
      <button class="pin-key" data-d="1">1</button>
      <button class="pin-key" data-d="2">2</button>
      <button class="pin-key" data-d="3">3</button>
      <button class="pin-key" data-d="4">4</button>
      <button class="pin-key" data-d="5">5</button>
      <button class="pin-key" data-d="6">6</button>
      <button class="pin-key" data-d="7">7</button>
      <button class="pin-key" data-d="8">8</button>
      <button class="pin-key" data-d="9">9</button>
      <button class="pin-key pin-back" id="pin-back">←</button>
      <button class="pin-key" data-d="0">0</button>
      <button class="pin-key pin-ok" id="pin-ok" title="Unlock">✓</button>
    </div>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden" style="display:flex;flex-direction:column;height:100vh;">
  <header>
    <button class="icon-btn sidebar-toggle" id="sidebar-toggle">☰</button>
    <button class="icon-btn search-toggle-btn" id="search-toggle-btn" title="Search">🔍</button>
    <div id="search-bar-wrap" class="search-bar-wrap">
      <input type="text" id="search-input" class="search-input" placeholder="Search notes, projects, boards, commands…" autocomplete="off" spellcheck="false">
      <div id="search-dropdown" class="search-dropdown hidden"></div>
      <button class="icon-btn search-close-btn" id="search-close-btn" title="Close">✕</button>
    </div>
    <div class="header-right">
      <div class="online-dot" id="online-dot" title="Online"></div>
    </div>
  </header>

  <div id="main-area">
    <!-- Unified left panel -->
    <div id="left-panel" class="left-panel">
      <div class="left-panel-nav" id="left-panel-nav">
        <div class="nav-row" draggable="true" data-tab="notes">
          <button class="icon-btn nav-reorder-btn nav-up-btn" title="Move up">▲</button>
          <button class="icon-btn nav-reorder-btn nav-down-btn" title="Move down">▼</button>
          <button class="nav-menu-item active" data-tab="notes">Notes</button>
          <button class="icon-btn nav-add-btn" id="new-note-btn" title="New note">+</button>
        </div>
        <div class="nav-row" draggable="true" data-tab="tasks">
          <button class="icon-btn nav-reorder-btn nav-up-btn" title="Move up">▲</button>
          <button class="icon-btn nav-reorder-btn nav-down-btn" title="Move down">▼</button>
          <button class="nav-menu-item" data-tab="tasks">Projects</button>
          <button class="icon-btn nav-add-btn" id="add-board-btn" title="New board">+</button>
        </div>
        <div class="nav-row" draggable="true" data-tab="expenses">
          <button class="icon-btn nav-reorder-btn nav-up-btn" title="Move up">▲</button>
          <button class="icon-btn nav-reorder-btn nav-down-btn" title="Move down">▼</button>
          <button class="nav-menu-item" data-tab="expenses">Expenses</button>
          <button class="icon-btn nav-add-btn" id="add-expense-btn" title="New expense">+</button>
        </div>
        <div class="nav-row" draggable="true" data-tab="calendar">
          <button class="icon-btn nav-reorder-btn nav-up-btn" title="Move up">▲</button>
          <button class="icon-btn nav-reorder-btn nav-down-btn" title="Move down">▼</button>
          <button class="nav-menu-item" data-tab="calendar">Calendar</button>
          <button class="icon-btn nav-add-btn" id="add-reminder-btn" title="New reminder">+</button>
        </div>
        <div class="nav-row" draggable="true" data-tab="calls">
          <button class="icon-btn nav-reorder-btn nav-up-btn" title="Move up">▲</button>
          <button class="icon-btn nav-reorder-btn nav-down-btn" title="Move down">▼</button>
          <button class="nav-menu-item" data-tab="calls">Calls</button>
          <button class="icon-btn nav-add-btn" id="new-call-btn" title="New call">+</button>
        </div>
        <div class="nav-row" draggable="true" data-tab="audits">
          <button class="icon-btn nav-reorder-btn nav-up-btn" title="Move up">▲</button>
          <button class="icon-btn nav-reorder-btn nav-down-btn" title="Move down">▼</button>
          <button class="nav-menu-item" data-tab="audits">Audits</button>
          <button class="icon-btn nav-add-btn" id="new-audit-btn" title="New audit">+</button>
        </div>
      </div>
      <div id="notes-panel" class="panel-section">
        <div id="tags-bar" class="tags-bar" style="display:none"></div>
        <div class="notes-list" id="notes-list"></div>
        <div class="import-btn-wrap">
          <button id="import-btn">⬆ Import .md files</button>
          <input type="file" id="import-input" accept=".md" multiple style="display:none">
        </div>
      </div>
      <div id="tasks-panel" class="panel-section hidden">
        <div class="boards-list" id="boards-list"></div>
      </div>
      <div id="expenses-panel" class="panel-section hidden">
        <div id="expense-cat-bar" class="tags-bar" style="display:none"></div>
        <div class="expense-cats-section">
          <div class="expense-cats-header"><span>Categories</span></div>
          <div id="expense-cats-list"></div>
        </div>
        <div class="expense-actions">
          <button id="export-csv-btn">↑ Export</button>
          <label>↓ Import<input type="file" id="import-csv-input" accept=".csv,.CSV" style="display:none"></label>
        </div>
      </div>
      <div id="calendar-panel" class="panel-section hidden">
        <div class="import-btn-wrap">
          <button id="enable-notifs-btn" class="hidden">🔔 Enable notifications</button>
        </div>
      </div>
      <div id="calls-panel" class="panel-section hidden">
        <div class="calls-panel-info" id="calls-panel-info"></div>
        <div class="calls-usage-info" id="calls-usage-info"></div>
      </div>
      <div id="audits-panel" class="panel-section hidden">
        <div class="notes-list" id="audits-list"></div>
      </div>
      <div class="left-panel-footer">
        <button class="icon-btn" id="trash-btn" title="Trash">🗑</button>
        <button class="icon-btn" id="lock-btn" title="Lock">🔒</button>
      </div>
    </div>

    <!-- Sidebar overlay (mobile) -->
    <div id="sidebar-overlay"></div>

    <!-- Notes view -->
    <div class="view" id="notes-view">
      <div class="note-editor-area" id="note-editor-area">
        <div style="color:#555;font-size:14px;display:flex;align-items:center;justify-content:center;flex:1;">
          Select or create a note &nbsp;<span style="color:#2a2a2a;font-size:12px;">⌘K to search</span>
        </div>
      </div>
    </div>

    <!-- Trash view -->
    <div class="view hidden" id="trash-view" style="flex-direction:column;overflow-y:auto;">
      <div class="trash-header">
        <span class="trash-title">Trash</span>
        <button class="empty-trash-btn" id="empty-trash-btn">Empty trash</button>
      </div>
      <div id="trash-content" class="trash-content"></div>
    </div>

    <!-- Expenses view -->
    <div class="view hidden" id="expenses-view" style="flex-direction:column;">
      <div id="expenses-list-area"></div>
    </div>

    <!-- Calendar view -->
    <div class="view hidden" id="calendar-view" style="flex-direction:column;overflow-y:auto;">
      <div id="agenda-list" class="agenda-list"></div>
    </div>

    <!-- Audits view -->
    <div class="view hidden" id="audits-view" style="flex-direction:column;overflow-y:auto;">
      <div id="audit-editor-area">
        <div style="color:#555;font-size:14px;display:flex;align-items:center;justify-content:center;flex:1;padding:40px;">
          Select an audit, or hit + to start a new one.
        </div>
      </div>
    </div>

    <!-- Calls view (dialer) -->
    <div class="view hidden" id="calls-view" style="flex-direction:column;overflow-y:auto;">
      <div class="dialer-area">
        <div class="dialer-card">
          <div id="dialer-status" class="dialer-status">Loading…</div>
          <input type="tel" id="dial-number" class="dial-number-input" placeholder="(555) 123-4567" autocomplete="off" spellcheck="false">
          <div class="dial-pad" id="dial-pad">
            <button class="dial-key" data-k="1">1</button>
            <button class="dial-key" data-k="2">2</button>
            <button class="dial-key" data-k="3">3</button>
            <button class="dial-key" data-k="4">4</button>
            <button class="dial-key" data-k="5">5</button>
            <button class="dial-key" data-k="6">6</button>
            <button class="dial-key" data-k="7">7</button>
            <button class="dial-key" data-k="8">8</button>
            <button class="dial-key" data-k="9">9</button>
            <button class="dial-key" data-k="*">*</button>
            <button class="dial-key" data-k="0">0</button>
            <button class="dial-key" data-k="#">#</button>
          </div>
          <div class="dial-actions">
            <button class="dial-back-key" id="dial-back">←</button>
            <button class="dial-call-btn" id="dial-call-btn">Call</button>
            <button class="dial-hangup-btn hidden" id="dial-hangup-btn">Hang Up</button>
          </div>
        </div>
        <div class="call-log" id="call-log"></div>
      </div>
    </div>

    <!-- Tasks view -->
    <div class="view hidden" id="tasks-view" style="flex-direction:column;">
      <div id="mobile-col-nav" class="mobile-col-nav">
        <button id="prev-col-btn" class="col-nav-arrow">‹</button>
        <span id="col-nav-label"></span>
        <button id="next-col-btn" class="col-nav-arrow">›</button>
      </div>
      <div id="bulk-actions" class="bulk-actions hidden">
        <span id="sel-count">0 selected</span>
        <button class="danger-btn" id="bulk-delete-btn">Delete selected</button>
        <button class="cancel-sel-btn" id="cancel-sel-btn">Cancel</button>
      </div>
      <div id="task-tags-bar" class="tags-bar" style="display:none"></div>
      <div id="kanban-area" style="flex:1;overflow:hidden;display:flex;"></div>
    </div>
  </div>
</div>

<!-- Chase Import Preview Modal -->
<div id="chase-import-modal" class="hidden">
  <div class="expense-modal-box">
    <div class="expense-modal-header">
      <span id="chase-import-label">Chase Import</span>
      <button class="modal-close-btn" id="chase-import-close">✕</button>
    </div>
    <div id="chase-import-preview" class="chase-import-preview"></div>
    <div class="expense-modal-footer">
      <div></div>
      <div style="display:flex;gap:8px;">
        <button class="cancel-sel-btn" id="chase-import-cancel">Cancel</button>
        <button class="save-btn" id="chase-import-confirm">Import</button>
      </div>
    </div>
  </div>
</div>

<!-- Expense modal -->
<div id="expense-modal" class="hidden">
  <div class="expense-modal-box">
    <div class="expense-modal-header">
      <span id="expense-modal-label">New Expense</span>
      <button class="modal-close-btn" id="expense-modal-close">✕</button>
    </div>
    <div class="expense-modal-body">
      <div class="expense-field-row">
        <label>Date</label>
        <div class="dp-wrap" id="exp-date-wrap">
          <div class="dp-input-row">
            <input type="text" id="exp-date" class="dp-text-input" placeholder="MM/DD/YYYY" autocomplete="off" spellcheck="false">
            <button class="dp-icon-btn" id="exp-date-trigger" type="button" title="Open calendar">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
                <rect x="1" y="3" width="14" height="12" rx="1.5"/>
                <path d="M1 7h14M5 1v4M11 1v4"/>
              </svg>
            </button>
          </div>
          <div class="dp-cal hidden" id="exp-date-cal"></div>
        </div>
      </div>
      <div class="expense-field-row">
        <label>Amount</label>
        <input type="number" id="exp-amount" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="expense-field-row">
        <label>Type</label>
        <select id="exp-direction">
          <option value="withdrawal">Withdrawal</option>
          <option value="deposit">Deposit</option>
        </select>
      </div>
      <div class="expense-field-row">
        <label>Category</label>
        <input type="text" id="exp-category" list="exp-cat-list" placeholder="e.g. Food" autocomplete="off">
        <datalist id="exp-cat-list"></datalist>
      </div>
      <div class="expense-field-row">
        <label>Payee</label>
        <input type="text" id="exp-payee" placeholder="Who you paid">
      </div>
      <div class="expense-field-row">
        <label>Source</label>
        <input type="text" id="exp-source" list="exp-source-list" placeholder="Cash, Debit, Credit…" autocomplete="off">
        <datalist id="exp-source-list">
          <option value="Bank Transfer">
          <option value="Cash">
          <option value="Check">
          <option value="Credit">
          <option value="Debit">
        </datalist>
      </div>
      <div class="expense-field-row">
        <label>Frequency</label>
        <input type="text" id="exp-frequency" list="exp-freq-list" placeholder="Monthly, Weekly…" autocomplete="off">
        <datalist id="exp-freq-list">
          <option value="Biweekly">
          <option value="Every 3 months">
          <option value="Monthly">
          <option value="One-time">
          <option value="Weekly">
          <option value="Yearly">
        </datalist>
      </div>
      <div class="expense-field-row">
        <label>Note</label>
        <input type="text" id="exp-note" placeholder="Optional memo">
      </div>
    </div>
    <div class="expense-modal-footer">
      <button class="del-task-btn" id="expense-modal-delete">Delete</button>
      <div style="display:flex;gap:8px;">
        <button class="cancel-sel-btn" id="expense-modal-cancel">Cancel</button>
        <button class="save-btn" id="expense-modal-save">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Reminder modal -->
<div id="reminder-modal" class="hidden">
  <div class="expense-modal-box">
    <div class="expense-modal-header">
      <span id="reminder-modal-label">New Reminder</span>
      <button class="modal-close-btn" id="reminder-modal-close">✕</button>
    </div>
    <div class="expense-modal-body">
      <div class="expense-field-row">
        <label>Title</label>
        <input type="text" id="rem-title" placeholder="What to remind you of" autocomplete="off">
      </div>
      <div class="expense-field-row">
        <label>Note</label>
        <input type="text" id="rem-desc" placeholder="Optional details" autocomplete="off">
      </div>
      <div class="expense-field-row">
        <label>Date</label>
        <div class="dp-wrap" id="rem-date-wrap">
          <div class="dp-input-row">
            <input type="text" id="rem-date" class="dp-text-input" placeholder="MM/DD/YYYY" autocomplete="off" spellcheck="false">
            <button class="dp-icon-btn" id="rem-date-trigger" type="button" title="Open calendar">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
                <rect x="1" y="3" width="14" height="12" rx="1.5"/>
                <path d="M1 7h14M5 1v4M11 1v4"/>
              </svg>
            </button>
          </div>
          <div class="dp-cal hidden" id="rem-date-cal"></div>
        </div>
      </div>
      <div class="expense-field-row">
        <label>Time</label>
        <input type="time" id="rem-time">
      </div>
      <div class="expense-field-row">
        <label>Remind before</label>
        <input type="number" id="rem-lead" min="1" placeholder="—" style="max-width:70px;">
        <select id="rem-lead-unit" style="flex:0 1 110px;" disabled>
          <option value="1">minutes</option>
          <option value="60">hours</option>
          <option value="1440">days</option>
        </select>
        <span class="rem-unit">empty = at time only</span>
      </div>
      <div class="expense-field-row">
        <label>Repeat</label>
        <select id="rem-recur">
          <option value="none">None</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>
      <div class="expense-field-row rem-recur-only hidden" id="rem-interval-row">
        <label>Every</label>
        <input type="number" id="rem-interval" min="1" value="1" style="max-width:70px;">
        <span id="rem-interval-unit" class="rem-unit">days</span>
      </div>
      <div class="expense-field-row rem-recur-only hidden" id="rem-weekdays-row">
        <label>Days</label>
        <div class="rem-weekdays" id="rem-weekdays">
          <button type="button" class="rem-wd" data-d="0">S</button>
          <button type="button" class="rem-wd" data-d="1">M</button>
          <button type="button" class="rem-wd" data-d="2">T</button>
          <button type="button" class="rem-wd" data-d="3">W</button>
          <button type="button" class="rem-wd" data-d="4">T</button>
          <button type="button" class="rem-wd" data-d="5">F</button>
          <button type="button" class="rem-wd" data-d="6">S</button>
        </div>
      </div>
      <div class="expense-field-row rem-recur-only hidden" id="rem-end-row">
        <label>Ends</label>
        <input type="text" id="rem-end" placeholder="MM/DD/YYYY (optional)" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="expense-modal-footer">
      <button class="del-task-btn" id="reminder-modal-delete">Delete</button>
      <div style="display:flex;gap:8px;">
        <button class="cancel-sel-btn" id="reminder-modal-cancel">Cancel</button>
        <button class="save-btn" id="reminder-modal-save">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Task modal -->
<div id="task-modal" class="hidden">
  <div class="modal-box">
    <div class="modal-header">
      <input class="modal-title-input" id="modal-title" placeholder="Task title" type="text">
      <button class="claude-mark-btn" id="modal-claude-mark" title="Mark for Claude Code"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="10.5" y="2" width="3" height="20" rx="1.5"/><rect x="10.5" y="2" width="3" height="20" rx="1.5" transform="rotate(30 12 12)"/><rect x="10.5" y="2" width="3" height="20" rx="1.5" transform="rotate(60 12 12)"/><rect x="10.5" y="2" width="3" height="20" rx="1.5" transform="rotate(90 12 12)"/><rect x="10.5" y="2" width="3" height="20" rx="1.5" transform="rotate(120 12 12)"/><rect x="10.5" y="2" width="3" height="20" rx="1.5" transform="rotate(150 12 12)"/></svg></button>
      <button class="modal-close-btn" id="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-section-label">Tags</div>
      <div class="tag-editor" id="task-tag-editor"></div>
      <div class="modal-section-label">Description</div>
      <div id="modal-editor-mount"></div>
    </div>
    <div class="modal-footer">
      <button class="del-task-btn" id="modal-delete">Delete</button>
      <div class="modal-move-selects">
        <select class="modal-board-select" id="modal-board-select" title="Move to board"></select>
        <select class="modal-col-select" id="modal-col-select" title="Move to column"></select>
      </div>
    </div>
  </div>
</div>


<div id="toast"></div>
<script src="/editor.bundle.js?v=66"></script>
<script src="/dialer.bundle.js?v=1"></script>
<script src="/app.js?v=132"></script>
</body>
</html>
